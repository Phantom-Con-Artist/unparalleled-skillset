<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unparalleled UI — Application Shell</title>
  <link rel="stylesheet" href="./tokens.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--surface-app-bg);
      color: var(--text-primary);
      font-family: var(--font-family-ui);
      min-height: 100vh;
      display: flex;
    }
    .app-sidebar {
      width: 240px;
      background: var(--surface-panel);
      border-right: 1px solid var(--border-subtle);
      padding: 1.25rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }
    .app-brand {
      font-weight: 700;
      letter-spacing: -0.02em;
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .brand-badge {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--interactive-primary);
    }
    .nav-list { list-style: none; display: flex; flex-direction: column; gap: 0.25rem; }
    .nav-item a {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.5rem 0.75rem;
      color: var(--text-secondary);
      text-decoration: none;
      border-radius: 6px;
      font-size: 0.875rem;
      transition: background-color 140ms ease, color 140ms ease;
    }
    .nav-item a:hover {
      background: var(--surface-card-hover);
      color: var(--text-primary);
    }
    .nav-item a.active {
      background: var(--surface-card);
      color: var(--text-primary);
      font-weight: 600;
      box-shadow: var(--inner-highlight);
    }
    .nav-item a:focus-visible {
      outline: 2px solid var(--focus-ring);
      outline-offset: 2px;
    }
    .app-main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }
    .app-header {
      height: 56px;
      border-bottom: 1px solid var(--border-subtle);
      padding: 0 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--surface-panel);
    }
    .breadcrumb {
      font-size: 0.875rem;
      color: var(--text-secondary);
    }
    .breadcrumb span { color: var(--text-primary); font-weight: 500; }
    .app-content {
      padding: 2rem;
      flex: 1;
      overflow-y: auto;
    }
  </style>
</head>
<body>
  <aside class="app-sidebar" aria-label="Primary Navigation">
    <div class="app-brand">
      <span class="brand-badge"></span>
      Unparalleled UI
    </div>
    <nav>
      <ul class="nav-list">
        <li class="nav-item"><a href="#overview" class="active">Overview</a></li>
        <li class="nav-item"><a href="#deployments">Deployments</a></li>
        <li class="nav-item"><a href="#telemetry">Telemetry</a></li>
        <li class="nav-item"><a href="#settings">Settings</a></li>
      </ul>
    </nav>
  </aside>
  <div class="app-main">
    <header class="app-header">
      <div class="breadcrumb">Workspace / <span>Production Cluster</span></div>
      <button class="btn-ghost" style="padding: 0.4rem 0.8rem; background: var(--surface-card); color: var(--text-primary); border: 1px solid var(--border-subtle); border-radius: 6px; cursor: pointer;">Cmd+K</button>
    </header>
    <main class="app-content">
      <!-- Slot for dynamic view / data table -->
    </main>
  </div>
</body>
</html>
