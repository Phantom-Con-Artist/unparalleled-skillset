<div class="bento-container" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1.5rem; max-width: 1200px; margin: 0 auto; padding: 0 1.5rem;">

  <div class="bento-cell" style="background: var(--surface-card); border: 1px solid var(--border-subtle); border-radius: 12px; padding: 2rem;">
