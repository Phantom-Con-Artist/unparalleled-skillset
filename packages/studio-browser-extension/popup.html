<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Unparalleled Studio references</title><style>
@font-face{font-family:Archivo;src:url('assets/archivo.woff2');font-weight:100 900}*{box-sizing:border-box}body{width:340px;margin:0;padding:20px;background:#f2f2ed;color:#252622;font:14px/1.5 Archivo,Arial,sans-serif}h1{font-size:19px;margin:0 0 8px}p{font-size:12px;color:#55574e}label{display:block;margin:13px 0 5px;font-size:13px;font-weight:600}input,select{width:100%;padding:9px;border:1px solid #85887e;background:white;color:#252622;border-radius:0;font:inherit}button{font:inherit;min-height:38px;padding:8px 11px;border:1px solid #85887e;background:#f2f2ed;color:#252622;cursor:pointer;border-radius:2px}button:hover{background:#e0e2d8}.primary{background:#aa341e;border-color:#aa341e;color:white}.primary:hover{background:#872715}.actions{display:flex;gap:8px;margin-top:16px}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #aa341e;outline-offset:3px}details{margin-top:16px}summary{cursor:pointer;font-size:12px}#status{min-height:18px;overflow-wrap:anywhere}
</style></head><body><h1>Bring a reference.</h1><p>Pick from this tab and send it to your local project's IDE agent.</p><label for="intent">Use the reference to…</label><select id="intent"><option value="inspire">Inspire a new direction</option><option value="recreate">Recreate its structure</option><option value="redesign">Redesign it for my project</option></select><div class="actions"><button class="primary" id="pick">Pick an element</button><button id="page">Use whole page</button></div><details id="connection"><summary>Local project connection</summary><label for="url">Studio URL</label><input id="url" type="url" value="http://127.0.0.1:4310"><label for="token">Reference pairing key</label><input id="token" type="password" autocomplete="off"><p>Run the Studio agent tool's pair command in your project. Paste its reference key here.</p><button id="save">Save connection</button></details><p id="status" role="status"></p><script type="module" src="src/popup.mjs"></script></body></html>
