[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "color-intelligence-layer"
version = "0.1.0-alpha"
description = "Color analysis and palette generation for AI design agents."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Multimedia :: Graphics",
]
authors = [
    {name = "Color Engine Team"}
]
keywords = [
    "color",
    "color-science",
    "oklch",
    "oklab",
    "harmony",
    "matsuda",
    "wcag",
    "apca",
    "ai-agents",
    "palette-generator"
]
dependencies = [
    "colour-science>=0.4.7",
    "scipy>=1.15.0",
    "pandas>=2.2.0",
    "pyarrow>=15.0.0",
    "scikit-learn>=1.5.0",
    "matplotlib>=3.9.0",
    "seaborn>=0.13.0",
    "fastembed>=0.9.0",
    "joblib>=1.4.0",
    "numpy>=1.26.0",
]

[project.urls]
Homepage = "https://github.com/color-engine/color-engine"

[tool.setuptools.packages.find]
where = ["."]
include = ["color_engine*"]

[tool.setuptools.package-data]
color_engine = ["resources/*.json"]
